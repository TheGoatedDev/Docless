on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      - name: Trigger prod
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run prod.yml --repo "$GITHUB_REPOSITORY" -f tag="${{ steps.release.outputs.tag_name }}"
